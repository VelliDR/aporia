<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aporia // Çelişki ve Şiir Laboratuvarı (Tek Dosya Sürümü)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0505; color: #ece3e3; font-family: monospace; }
        #editor { transition: opacity 0.2s ease; }
        textarea::-webkit-scrollbar { display: none; }
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-6 selection:bg-[#ff3333] selection:text-[#0a0505]">

    <header class="max-w-3xl w-full mx-auto mb-4 md:mb-6">
        <div class="border border-[#331111] bg-[#140a0a] p-4 rounded-lg shadow-lg relative overflow-hidden">
            <div class="absolute top-0 left-0 h-1 bg-[#ff3333]" id="fade-bar" style="width: 100%;"></div>
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] md:text-xs uppercase tracking-widest text-[#883333]">Aktif Kısıtlama // 7s Akış Hücresi</span>
                <span class="text-[10px] md:text-xs text-[#662222]" id="timer-label">Zaman sızıyor...</span>
            </div>
            <p id="prompt-box" class="text-xs md:text-base text-[#ff6666] italic leading-snug">
                "Yazmaya başla. 7 saniye durursan nehir her şeyi yutacak."
            </p>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto flex items-center justify-center">
        <textarea 
            id="editor" 
            class="w-full h-[55vh] md:h-[60vh] bg-transparent border-none outline-none resize-none text-base md:text-xl leading-relaxed text-[#ece3e3] placeholder:text-[#331a1a]"
            placeholder="İlk kelimeyi fırlat ve akıntıya karşı yüz..."
            spellcheck="false"
            autofocus
        ></textarea>
    </main>

    <footer class="max-w-3xl w-full mx-auto mt-4 md:mt-6 flex justify-between items-center border-t border-[#1a0a0a] pt-4 text-[11px] md:text-xs text-[#552222]">
        <div>
            <span id="char-count">0</span> karakter // <span id="word-count">0</span> kelime
        </div>
        <div class="flex gap-2 md:gap-4">
            <button 
                id="archive-btn" 
                class="px-2.5 py-1 border border-[#331111] rounded text-[#883333] hover:border-[#ff3333] hover:text-[#ff3333] transition-all"
            >
                Yerel Arşiv 🔒
            </button>
            <button 
                id="provoke-btn" 
                class="px-2.5 py-1 border border-[#552222] rounded hover:bg-[#331111] hover:text-[#ff3333] transition-all"
            >
                Zihni Kışkırt
            </button>
        </div>
    </footer>

    <!-- Arşiv Modalı -->
    <div id="archive-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-4">
        <div class="border border-[#331111] bg-[#0c0606] max-w-2xl w-full max-h-[80vh] rounded-lg p-4 md:p-6 flex flex-col justify-between shadow-2xl">
            <div class="flex justify-between items-center border-b border-[#220a0a] pb-3 mb-4">
                <div>
                    <h3 class="text-xs md:text-sm uppercase tracking-widest text-[#ff3333] font-bold">Mühürlü Eserler</h3>
                    <p class="text-[10px] text-[#552222] lowercase mt-0.5">veriler tamamen bu tarayıcıda saklanır, buluta sızmaz.</p>
                </div>
                <button id="close-archive" class="text-[#883333] hover:text-[#ff3333] text-2xl leading-none">&times;</button>
            </div>
            <div id="archive-list" class="flex-grow overflow-y-auto space-y-4 pr-1 max-h-[60vh] text-xs md:text-sm leading-relaxed">
                <p class="text-[#441111] italic text-center py-8">Henüz hiçbir eser mühürlenmedi.</p>
            </div>
        </div>
    </div>

    <script>
        class Storage {
            static KEYS = { DRAFT: 'aporia_draft', LAST_ACTIVE: 'aporia_last_active', FRAGMENTS: 'aporia_fragments', SEALED_WORKS: 'aporia_sealed_works' };
            static safeGetJSON(key, defaultValue = []) {
                try { const data = localStorage.getItem(key); return data ? JSON.parse(data) : defaultValue; } catch (e) { return defaultValue; }
            }
            static saveDraft(text) {
                if (!text || text.trim() === "") { this.clearDraft(); return; }
                try { localStorage.setItem(this.KEYS.DRAFT, text); localStorage.setItem(this.KEYS.LAST_ACTIVE, Date.now().toString()); } catch (e) {}
            }
            static getDraft() {
                try { return { text: localStorage.getItem(this.KEYS.DRAFT) || "", lastActive: parseInt(localStorage.getItem(this.KEYS.LAST_ACTIVE) || '0', 10) }; } catch (e) { return { text: "", lastActive: 0 }; }
            }
            static clearDraft() {
                try { localStorage.removeItem(this.KEYS.DRAFT); localStorage.removeItem(this.KEYS.LAST_ACTIVE); } catch (e) {}
            }
            static saveFragment(text, wordCount) {
                try {
                    const saved = this.safeGetJSON(this.KEYS.FRAGMENTS, []);
                    saved.push({ id: Date.now(), createdAt: new Date().toISOString(), wordCount, content: text });
                    localStorage.setItem(this.KEYS.FRAGMENTS, JSON.stringify(saved));
                } catch (e) {}
            }
            static sealWork(text) {
                try {
                    const cleanText = text.replace(/\s*BİTTİ\s*$/, "").trim();
                    const wordCount = cleanText === "" ? 0 : cleanText.split(/\s+/).length;
                    const sealedWorks = this.safeGetJSON(this.KEYS.SEALED_WORKS, []);
                    sealedWorks.push({ id: Date.now(), createdAt: new Date().toISOString(), charCount: cleanText.length, wordCount, content: cleanText });
                    localStorage.setItem(this.KEYS.SEALED_WORKS, JSON.stringify(sealedWorks));
                    this.clearDraft();
                } catch (e) {}
            }
            static getSealedWorks() { return this.safeGetJSON(this.KEYS.SEALED_WORKS, []); }
        }

        class SpamGuard {
            static isSpam(text) {
                if (!text || text.trim() === '') return false;
                try {
                    const words = text.trim().split(/\s+/);
                    if (words.length === 0) return false;
                    const recentWords = words.slice(-10);
                    let suspiciousCount = 0;
                    for (const word of recentWords) {
                        if (!word) continue;
                        const isLaughter = /^(ha|he|hi|a|e)+$/i.test(word);
                        if (word.length > 35) return true;
                        if (!isLaughter && /(.)\1{4,}/.test(word)) return true;
                        if (/[bcçdfgğhjklmnprsştvyz]{6,}/i.test(word)) return true;
                        if (!isLaughter && /[aeıioöuü]{6,}/i.test(word)) return true;
                        if (!isLaughter && /([a-zA-ZğüşıöçĞÜŞİÖÇ]{2,4})\1{2,}/.test(word)) return true;
                        if (word.length > 5 && !/[aeıioöuüAEIİOÖUÜ]/i.test(word)) suspiciousCount++;
                    }
                    return (recentWords.length >= 3 && (suspiciousCount / recentWords.length) > 0.3);
                } catch (e) { return false; }
            }
        }

        class Engine {
            constructor(prompts = []) {
                this.prompts = prompts;
                this.editor = document.getElementById('editor');
                this.fadeBar = document.getElementById('fade-bar');
                this.promptBox = document.getElementById('prompt-box');
                this.timerLabel = document.getElementById('timer-label');
                this.charCount = document.getElementById('char-count');
                this.wordCount = document.getElementById('word-count');
                this.idleTime = 0; this.maxIdle = 7; this.interval = null;
                this.lastTickTime = null; this.opacity = 1.0;
                this.lastSavedThreshold = 0; this.lastText = "";
                this.currentPrompt = "Yazmaya başla. 7 saniye durursan nehir her şeyi yutacak.";
            }
            start() {
                if (this.interval) clearInterval(this.interval);
                if (this.editor) this.editor.addEventListener('input', () => this.onInput(false));
                this.restoreDraft();
                this.lastTickTime = Date.now();
                this.interval = setInterval(() => this.tick(), 100);
            }
            restoreDraft() {
                const draft = Storage.getDraft();
                if (draft && draft.text && draft.lastActive > 0) {
                    const elapsedSeconds = (Date.now() - draft.lastActive) / 1000;
                    if (elapsedSeconds >= this.maxIdle) {
                        this.wipeEntirely("Sen yokken nehir yatağı değişti ve kelimelerin sulara gömüldü.");
                    } else {
                        if (this.editor) this.editor.value = draft.text;
                        this.lastText = draft.text; this.idleTime = elapsedSeconds; this.onInput(true);
                    }
                }
            }
            onInput(isRestore = false) {
                this.enforcePunctuationRules();
                const text = this.editor ? this.editor.value : "";
                if (text === this.lastText) return;
                if (SpamGuard.isSpam(text)) {
                    this.wipeEntirely("Spam algılandı! Nehir sahte kelimeleri anında yuttu.");
                    return;
                }
                if (this.promptBox && this.promptBox.innerText !== this.currentPrompt) {
                    this.promptBox.innerText = this.currentPrompt;
                }
                let isTimerReset = false;
                if (!isRestore) {
                    const getMeaningfulLength = (str) => str.replace(/[^\p{L}\p{N}]/gu, '').length;
                    if (getMeaningfulLength(text) > getMeaningfulLength(this.lastText) || text.length < this.lastText.length) {
                        this.idleTime = 0; isTimerReset = true;
                    }
                } else { isTimerReset = true; }
                this.lastText = text;
                if (isTimerReset) this.resetVisuals();
                Storage.saveDraft(text);
                this.updateStats();
                if (/(?:^|\s)BİTTİ\s*$/.test(text)) this.sealWork(text);
            }
            wipeEntirely(reason) {
                if (this.editor) this.editor.value = "";
                this.lastText = ""; this.idleTime = 0;
                this.resetVisuals(); Storage.clearDraft(); this.updateStats();
                if (this.promptBox) this.promptBox.innerText = reason;
                if (this.timerLabel) { this.timerLabel.innerText = "Hile kabul edilmez."; this.timerLabel.style.color = "#ff3333"; }
            }
            resetVisuals() {
                this.opacity = 1.0;
                if (this.editor) this.editor.style.opacity = 1.0;
                if (this.fadeBar) this.fadeBar.style.width = "100%";
                if (this.timerLabel) { this.timerLabel.innerText = "Akış güvende."; this.timerLabel.style.color = "#662222"; }
            }
            enforcePunctuationRules() {
                if (!this.editor) return;
                const val = this.editor.value;
                const cleaned = val.replace(/\.{4,}/g, '...');
                if (val !== cleaned) {
                    const start = this.editor.selectionStart;
                    const diff = val.length - cleaned.length;
                    this.editor.value = cleaned;
                    this.editor.setSelectionRange(Math.max(0, start - diff), Math.max(0, start - diff));
                }
            }
            tick() {
                const now = Date.now();
                const delta = (now - (this.lastTickTime || now)) / 1000;
                this.lastTickTime = now;
                const text = this.editor ? this.editor.value : "";
                if (text.trim() === "") { this.resetVisuals(); return; }
                this.idleTime += delta;
                const remaining = Math.max(0, this.maxIdle - this.idleTime);
                if (this.idleTime >= this.maxIdle) {
                    const fadeProgress = (this.idleTime - this.maxIdle) * 2;
                    this.opacity = Math.max(0, 1.0 - fadeProgress);
                    if (this.editor) this.editor.style.opacity = this.opacity;
                    if (this.fadeBar) this.fadeBar.style.width = `${this.opacity * 100}%`;
                    if (this.timerLabel) { this.timerLabel.innerText = "Akıntı kelimeleri yutuyor!"; this.timerLabel.style.color = "#ff3333"; }
                    if (this.opacity <= 0) this.wipeEntirely("Nehir kelimelerini yuttu. Temiz bir zihinle, durmadan yeniden başla.");
                } else {
                    const clampedWidth = Math.min(100, Math.max(0, (remaining / this.maxIdle) * 100));
                    if (this.fadeBar) this.fadeBar.style.width = `${clampedWidth}%`;
                    if (this.timerLabel) {
                        if (remaining <= 3) {
                            this.timerLabel.innerText = `Sular Yükseliyor: ${remaining.toFixed(1)}s`;
                            this.timerLabel.style.color = "#ff6666";
                        } else {
                            this.timerLabel.innerText = `Akış Güvende (${remaining.toFixed(1)}s)`;
                            this.timerLabel.style.color = "#662222";
                        }
                    }
                }
            }
            updateStats() {
                const text = this.editor ? this.editor.value.trim() : "";
                const currentWordCount = text === "" ? 0 : text.split(/\s+/).length;
                if (this.charCount) this.charCount.innerText = text.length;
                if (this.wordCount) this.wordCount.innerText = currentWordCount;
                if (currentWordCount > 0 && currentWordCount % 50 === 0 && currentWordCount !== this.lastSavedThreshold) {
                    Storage.saveFragment(text, currentWordCount);
                    this.lastSavedThreshold = currentWordCount;
                    if (this.timerLabel) {
                        this.timerLabel.innerText = `[${currentWordCount}. Kelime Mühürlendi. Nehir bu parçaya dokunamaz.]`;
                        this.timerLabel.style.color = "#00ff66";
                    }
                    this.idleTime = -1;
                }
            }
            sealWork(text) {
                Storage.sealWork(text);
                if (this.editor) this.editor.value = "";
                this.lastText = ""; this.idleTime = 0;
                this.resetVisuals(); this.updateStats();
                if (this.promptBox) this.promptBox.innerText = "MÜHÜR BASILDI. Eser akıntıdan kurtarıldı ve lokal belleğe kilitlendi.";
                if (this.timerLabel) { this.timerLabel.innerText = "Eser Yerel Güvende."; this.timerLabel.style.color = "#00ff66"; }
            }
            provoke() {
                if (!this.prompts || this.prompts.length === 0) return;
                const randomIndex = Math.floor(Math.random() * this.prompts.length);
                this.currentPrompt = this.prompts[randomIndex];
                if (this.promptBox) this.promptBox.innerText = this.currentPrompt;
                if (this.editor) this.editor.focus();
            }
        }

        const PROMPTS = [
            "Derrida: Son yazdığın romantik sıfatı sil ve yerine mekanik bir nesne koy.",
            "Oulipo Kuralı: Bu paragrafta artık 'e' (veya 'E') harfini kullanmayı bırak.",
            "Herakleitos Akışı: Bir sonraki cümleyi en son kelimesinden geriye doğru inşa et.",
            "Yapısöküm: En çok güvendiğin inancı yerle bir eden sert bir dize ekle.",
            "Sadece somut nesneleri (taş, demir, kül) kullanarak soyut bir acıyı anlat.",
            "Ritim Değişimi: Sonraki üç cümleyi sadece ikişer kelimeden oluştur.",
            "Nietzsche: Maskeni düşür. Az önce yazdığın dizeyi en çok nefret ettiğin karakterin gözünden oku ve yık.",
            "Cioran: Dünyanın tüm ağırlığını tek bir kelimeye sığdırmak zorunda olsan bu ne olurdu? O kelimeyle başla.",
            "Spinoza: Doğanın mekanik tıkırtısını hisset. Duygusal tüm kelimeleri geometrik kavramlarla değiştir.",
            "Camus: Sisyphos gibi yazıyorsun. Şimdi en iyi olduğunu düşündüğün o iki dizeyi sil ve yoluna devam et."
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const aporia = new Engine(PROMPTS);
            aporia.start();

            const provokeBtn = document.getElementById('provoke-btn');
            const archiveBtn = document.getElementById('archive-btn');
            const closeArchiveBtn = document.getElementById('close-archive');
            const archiveModal = document.getElementById('archive-modal');
            const archiveList = document.getElementById('archive-list');

            if (provokeBtn) provokeBtn.addEventListener('click', () => aporia.provoke());

            const closeModal = () => { if (archiveModal) archiveModal.classList.add('hidden'); };
            if (archiveBtn && archiveModal) archiveBtn.addEventListener('click', () => { renderArchive(); archiveModal.classList.remove('hidden'); });
            if (closeArchiveBtn) closeArchiveBtn.addEventListener('click', closeModal);
            if (archiveModal) archiveModal.addEventListener('click', (e) => { if (e.target === archiveModal) closeModal(); });

            function escapeHTML(str) {
                return str ? str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;') : '';
            }

            function renderArchive() {
                if (!archiveList) return;
                const works = Storage.getSealedWorks();
                archiveList.innerHTML = "";
                if (!works || works.length === 0) {
                    archiveList.innerHTML = `<p class="text-[#441111] italic text-center py-8">Mühürlenmiş hiçbir dize bulunamadı. Cihazında saklanan bir iz yok.</p>`;
                    return;
                }
                [...works].reverse().forEach(work => {
                    const card = document.createElement('div');
                    card.className = "border border-[#1a0a0a] bg-[#080404] p-4 rounded-md space-y-3";
                    let dateStr = work.createdAt ? new Date(work.createdAt).toLocaleString('tr-TR') : (work.date || "Bilinmeyen Tarih");
                    const safeContent = escapeHTML(work.content).replace(/\n/g, '<br>');
                    card.innerHTML = `
                        <div class="flex justify-between items-center text-xs text-[#552222] border-b border-[#150707] pb-2">
                            <span>🔒 Çevrimdışı Bellek // 📅 ${dateStr}</span>
                            <span>✍️ ${work.wordCount || 0} kelime</span>
                        </div>
                        <p class="text-[#ece3e3] italic leading-relaxed whitespace-pre-line">${safeContent}</p>
                        <div class="flex justify-end gap-3 text-xs pt-2">
                            <button class="copy-btn text-[#883333] hover:text-[#00ff66] transition-colors font-mono">Kopyala</button>
                        </div>
                    `;
                    const copyBtn = card.querySelector('.copy-btn');
                    if (copyBtn) {
                        copyBtn.addEventListener('click', async () => {
                            try {
                                await navigator.clipboard.writeText(work.content);
                                copyBtn.innerText = "Kopyalandı!";
                                copyBtn.classList.add('text-[#00ff66]');
                                setTimeout(() => { copyBtn.innerText = "Kopyala"; copyBtn.classList.remove('text-[#00ff66]'); }, 2000);
                            } catch (e) {}
                        });
                    }
                    archiveList.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
